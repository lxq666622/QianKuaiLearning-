workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
    scripts:
      - name: Patch Flutter SDK
        script: |
          set -e
          FTOOLS="${FLUTTER_ROOT}/packages/flutter_tools/lib/src/ios"
          for f in "$FTOOLS"/*.dart; do
            if grep -q "Development Team" "$f" 2>/dev/null; then
              sed -i "s/if (!_isDevelopmentTeamConfigured)/if (False and !_isDevelopmentTeamConfigured)/g" "$f"
              echo "Patched $f"
            fi
          done
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --no-codesign --release
    artifacts:
      - build/ios/iphoneos/Runner.app.zip
