workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      groups:
        - flutter
      vars:
        CI: "true"
        PUB_CACHE: "$HOME/.pub-cache"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
    scripts:
      - name: Step 0 - Prepare Flutter SDK
        script: |
          set -ex
          if [ -n "$FLUTTER_ROOT" ] && [ -x "$FLUTTER_ROOT/bin/flutter" ]; then
            export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"
          elif command -v flutter >/dev/null 2>&1; then
            echo "Flutter on PATH: $(which flutter)"
          else
            for d in "$HOME/programs/flutter" "/usr/local/share/flutter" "/opt/flutter"; do
              if [ -x "$d/bin/flutter" ]; then export PATH="$d/bin:$d/bin/cache/dart-sdk/bin:$PATH"; break; fi
            done
          fi
          flutter --version
          echo "=== Repo root (first 80 entries) ==="
          ls -laR "$(pwd)" | head -80
      - name: Step 1 - Auto detect project dir (find pubspec.yaml anywhere)
        script: |
          set -ex
          DETECTED=$(find "$(pwd)" -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -not -path "*/.symlinks/*" | head -1)
          if [ -z "$DETECTED" ]; then
            echo "FATAL: pubspec.yaml NOT FOUND anywhere in repo!"
            exit 2
          fi
          PROJECT_DIR=$(dirname "$DETECTED")
          echo "Detected PROJECT_DIR=$PROJECT_DIR"
          echo "export PROJECT_DIR=\"$PROJECT_DIR\"" > /tmp/project_dir.sh
      - name: Step 2 - Verify critical files exist
        script: |
          set -ex
          source /tmp/project_dir.sh
          cd "$PROJECT_DIR"
          echo "Working dir: $(pwd)"
          ls -la
          echo "=== lib/main.dart first 5 lines (should be QianKuaiLearning NOT Demo counter) ==="
          head -5 lib/main.dart
          for f in pubspec.yaml lib/main.dart lib/app.dart; do
            if [ -f "$f" ]; then echo "OK: found $f ($(wc -c < $f) bytes)"; else echo "FAIL: MISSING $f"; fi
          done
      - name: Step 3 - Auto create android ios folders + RESTORE ORIGINAL lib (fix Demo overwrite bug!)
        script: |
          set -ex
          source /tmp/project_dir.sh
          if [ -n "$FLUTTER_ROOT" ]; then export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"; fi
          cd "$PROJECT_DIR"
          echo "=== Backing up original lib/ (contains real app code, NOT Flutter Demo) ==="
          rm -rf /tmp/lib_backup
          cp -R lib /tmp/lib_backup
          echo "Backup size: $(du -sh /tmp/lib_backup | cut -f1)"
          echo "Backup lib/main.dart first 3 lines:"
          head -3 /tmp/lib_backup/main.dart
          if [ ! -d android ] || [ ! -d ios ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "Running flutter create --platforms=android,ios --org com.qiankuai.learning --project-name qiankuailearning ."
            flutter create --platforms=android,ios --org com.qiankuai.learning --project-name qiankuailearning . --overwrite 2>&1 | tail -80 || true
          fi
          echo "=== Deleting default Demo lib/ generated by flutter create ==="
          rm -rf lib
          echo "=== RESTORING original QianKuaiLearning lib/ backup ==="
          cp -R /tmp/lib_backup lib
          echo "RESTORE DONE! lib/main.dart first 5 lines are now back to REAL app:"
          head -5 lib/main.dart
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Found AndroidManifest.xml, ensuring Flutter Embedding V2"
            if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
              awk '/<application>/ {print; print "        <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />"; next}1' android/app/src/main/AndroidManifest.xml > /tmp/manifest_patched.xml
              mv /tmp/manifest_patched.xml android/app/src/main/AndroidManifest.xml
            fi
            sed -i.bak 's|android:name=".*MainActivity"|android:name="io.flutter.embedding.android.FlutterFragmentActivity"|g' android/app/src/main/AndroidManifest.xml || true
          fi
      - name: Step 4 - Flutter clean and pub get
        script: |
          set -ex
          source /tmp/project_dir.sh
          if [ -n "$FLUTTER_ROOT" ]; then export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"; fi
          export PUB_CACHE="$HOME/.pub-cache"
          mkdir -p "$PUB_CACHE"
          cd "$PROJECT_DIR"
          echo "=== Final verification BEFORE build (lib/main.dart head 10 lines, MUST show import app.dart! not Demo!) ==="
          head -10 lib/main.dart
          flutter clean || true
          echo "Running flutter pub get"
          flutter pub get 2>&1 | tail -80
      - name: Step 5 - Build Android APK (release, GLOBAL FIND + copy to /tmp GUARANTEE artifact)
        script: |
          set -ex
          source /tmp/project_dir.sh
          if [ -n "$FLUTTER_ROOT" ]; then export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"; fi
          REPO_ROOT="$(pwd)"
          echo "REPO_ROOT=$REPO_ROOT"
          cd "$PROJECT_DIR"
          set +e
          flutter build apk --release --no-tree-shake-icons > /tmp/build_apk.log 2>&1
          APK_RC=$?
          set -e
          echo "=== APK build last 120 lines ==="
          tail -120 /tmp/build_apk.log
          echo "APK build exited with rc=$APK_RC"
          echo "=== GLOBALLY searching for any app-release.apk under REPO_ROOT ($REPO_ROOT) ==="
          APK_FOUND=$(find "$REPO_ROOT" -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_FOUND" ]; then
            echo "SUCCESS: APK FOUND at: $APK_FOUND ($(wc -c < "$APK_FOUND") bytes)"
            cp -f "$APK_FOUND" /tmp/app-release.apk
            echo "COPIED to /tmp/app-release.apk: $(wc -c < /tmp/app-release.apk) bytes (artifact GUARANTEED!)"
          else
            echo "WARN: APK not found globally, listing build dirs:"
            find "$REPO_ROOT" -name "*.apk" 2>/dev/null || true
            find "$REPO_ROOT" -maxdepth 8 -type d -name "flutter-apk" 2>/dev/null || true
          fi
      - name: Step 6 - Build iOS IPA (no code signing, GLOBAL FIND Runner.app + pack IPA to /tmp GUARANTEE artifact!)
        script: |
          set -ex
          source /tmp/project_dir.sh
          if [ -n "$FLUTTER_ROOT" ]; then export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"; fi
          REPO_ROOT="$(pwd)"
          echo "REPO_ROOT=$REPO_ROOT"
          cd "$PROJECT_DIR"
          set +e
          flutter build ios --release --no-codesign --no-tree-shake-icons > /tmp/build_ios.log 2>&1
          IOS_RC=$?
          set -e
          echo "=== iOS build last 120 lines ==="
          tail -120 /tmp/build_ios.log
          echo "iOS build exited with rc=$IOS_RC"
          echo "=== GLOBALLY searching for Runner.app under REPO_ROOT ($REPO_ROOT) ==="
          RUNNER_FOUND=$(find "$REPO_ROOT" -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -n "$RUNNER_FOUND" ]; then
            echo "SUCCESS: Runner.app FOUND at: $RUNNER_FOUND"
            RUNNER_PARENT=$(dirname "$RUNNER_FOUND")
            echo "Runner.app parent dir: $RUNNER_PARENT"
            mkdir -p "$RUNNER_PARENT/Payload"
            cp -R "$RUNNER_FOUND" "$RUNNER_PARENT/Payload/"
            cd "$RUNNER_PARENT" && rm -f QianKuaiLearning_unsigned.ipa && zip -r QianKuaiLearning_unsigned.ipa Payload
            echo "SUCCESS: IPA created at $(pwd)/QianKuaiLearning_unsigned.ipa ($(wc -c < QianKuaiLearning_unsigned.ipa) bytes)"
            cp -f "$RUNNER_PARENT/QianKuaiLearning_unsigned.ipa" /tmp/QianKuaiLearning_unsigned.ipa
            echo "COPIED IPA to /tmp/QianKuaiLearning_unsigned.ipa: $(wc -c < /tmp/QianKuaiLearning_unsigned.ipa) bytes (artifact GUARANTEED!)"
          else
            echo "WARN: Runner.app NOT FOUND globally under $REPO_ROOT, listing build dirs:"
            find "$REPO_ROOT" -maxdepth 8 -type d -name "iphoneos" 2>/dev/null
            find "$REPO_ROOT" -maxdepth 8 -type d -name "build" 2>/dev/null
          fi
    artifacts:
      - "**/build/app/outputs/flutter-apk/app-release.apk"
      - "**/build/ios/iphoneos/QianKuaiLearning_unsigned.ipa"
      - "**/build/ios/iphoneos/Runner.app"
      - /tmp/QianKuaiLearning_unsigned.ipa
      - /tmp/app-release.apk
      - /tmp/build_apk.log
      - /tmp/build_ios.log
    publishing:
      email:
        recipients:
          - 2150835707@qq.com
        notify:
          success: true
          failure: true
