workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
    scripts:
      - name: Patch Flutter SDK
        script: |
          set +e
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          find "$FLUTTER_ROOT" -name "*.dart" -path "*flutter_tools*" | xargs grep -l "Development Team" 2>/dev/null | while read f; do
            echo "Patching $f"
            sed -i "s|if (!_isDevelopmentTeamConfigured)|if (False and !_isDevelopmentTeamConfigured)|g" "$f"
          done
          echo "=== Patch done ==="
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --no-codesign --release
    artifacts:
      - build/ios/iphoneos/Runner.app.zip
