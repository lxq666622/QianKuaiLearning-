workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      groups:
        - flutter
      vars:
        CI: "true"
        PUB_CACHE: "$HOME/.pub-cache"
        EXPORT_NO_SIGNING: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CM_CUSTOM_SIGNING_VARS_SET: "yes"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
    scripts:
      - name: Step 0 - Flutter SDK path
        script: |
          set -e
          if [ -n "$FLUTTER_ROOT" ] && [ -x "$FLUTTER_ROOT/bin/flutter" ]; then
            export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"
          elif ! command -v flutter >/dev/null 2>&1; then
            for d in "$HOME/programs/flutter" "/usr/local/share/flutter" "/opt/flutter"; do
              if [ -x "$d/bin/flutter" ]; then
                export PATH="$d/bin:$d/bin/cache/dart-sdk/bin:$PATH"
                break
              fi
            done
          fi
          echo "$PATH" > /tmp/flutter_path.env
          echo "export PATH=\"$PATH\"" > /tmp/flutter_path.sh
          echo "export CM_CODE_SIGNING_IDENTITY=\"\"" > /tmp/custom_signing.sh
          echo "export CM_PROVISIONING_PROFILE_SPECIFIER=\"\"" >> /tmp/custom_signing.sh
          echo "export CM_EXPANDED_CODE_SIGN_IDENTITY=\"\"" >> /tmp/custom_signing.sh
          flutter --version
      - name: Step 1 - Find pubspec.yaml project root
        script: |
          set -e
          DETECTED=$(find "$(pwd)" -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -not -path "*/.symlinks/*" | head -1)
          if [ -z "$DETECTED" ]; then
            echo "FATAL: pubspec.yaml not found in repo"
            exit 2
          fi
          PROJECT_DIR=$(dirname "$DETECTED")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "export PROJECT_DIR=\"$PROJECT_DIR\"" > /tmp/project_dir.sh
      - name: Step 2 - Verify files
        script: |
          set -e
          source /tmp/project_dir.sh
          source /tmp/flutter_path.sh
          cd "$PROJECT_DIR"
          echo "pwd=$(pwd)"
          echo "=== lib/main.dart first 5 lines ==="
          head -5 lib/main.dart
          for f in pubspec.yaml lib/main.dart lib/app.dart; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < $f) bytes)"
            else
              echo "MISSING: $f"
              exit 2
            fi
          done
      - name: Step 3 - Create android ios folders + restore lib + fix build configs
        script: |
          set -e
          source /tmp/project_dir.sh
          source /tmp/flutter_path.sh
          source /tmp/custom_signing.sh
          cd "$PROJECT_DIR"
          echo "=== Backup original lib ==="
          rm -rf /tmp/lib_backup
          cp -R lib /tmp/lib_backup
          echo "Backup size: $(du -sh /tmp/lib_backup | cut -f1)"
          if [ ! -d android ] || [ ! -d ios ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "=== flutter create to generate android ios folders ==="
            flutter create --platforms=android,ios --org com.qiankuai.learning --project-name qiankuailearning . --overwrite > /tmp/flutter_create.log 2>&1 || true
            echo "flutter create last 40 lines:"
            tail -40 /tmp/flutter_create.log
          fi
          echo "=== Restore original lib (overwrite Demo counter!) ==="
          rm -rf lib
          cp -R /tmp/lib_backup lib
          echo "=== lib/main.dart RESTORED first 5 lines: ==="
          head -5 lib/main.dart
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "=== Fix AndroidManifest V2 embedding ==="
            if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
              awk '/<application>/ {print; print "        <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />"; next}1' android/app/src/main/AndroidManifest.xml > /tmp/am.xml
              mv /tmp/am.xml android/app/src/main/AndroidManifest.xml
            fi
            sed -i.bak 's|android:name=".*MainActivity"|android:name="io.flutter.embedding.android.FlutterFragmentActivity"|g' android/app/src/main/AndroidManifest.xml || true
          fi
          if [ -f ios/Podfile ]; then
            echo "=== Fix Podfile: iOS 13.0 minimum ==="
            sed -i.bak "s|# platform :ios, '.*'|platform :ios, '13.0'|g" ios/Podfile
            sed -i.bak "s|platform :ios, '.*'|platform :ios, '13.0'|g" ios/Podfile
            if ! grep -q "post_install do |installer|" ios/Podfile; then
              echo "" >> ios/Podfile
              echo "post_install do |installer|" >> ios/Podfile
              echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
              echo "    flutter_additional_ios_build_settings(target)" >> ios/Podfile
              echo "    target.build_configurations.each do |config|" >> ios/Podfile
              echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'" >> ios/Podfile
              echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> ios/Podfile
              echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> ios/Podfile
              echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> ios/Podfile
              echo "      config.build_settings['CODE_SIGNING_IDENTITY'] = ''" >> ios/Podfile
              echo "      config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''" >> ios/Podfile
              echo "    end" >> ios/Podfile
              echo "  end" >> ios/Podfile
              echo "end" >> ios/Podfile
            fi
            echo "=== Podfile last 18 lines (post_install): ==="
            tail -18 ios/Podfile
          fi
          PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
          if [ -f "$PBXPROJ" ]; then
            echo "=== Remove signing lines from project.pbxproj ==="
            sed -i.bak '/DEVELOPMENT_TEAM =/d' "$PBXPROJ"
            sed -i.bak '/PROVISIONING_PROFILE_SPECIFIER =/d' "$PBXPROJ"
            sed -i.bak '/CODE_SIGN_IDENTITY =/d' "$PBXPROJ"
            sed -i.bak '/CODE_SIGN_STYLE =/d' "$PBXPROJ"
            sed -i.bak '/DEVELOPMENT_TEAM:/d' "$PBXPROJ"
            sed -i.bak '/PROVISIONING_PROFILE_SPECIFIER:/d' "$PBXPROJ"
            sed -i.bak '/CODE_SIGN_IDENTITY:/d' "$PBXPROJ"
            sed -i.bak '/CODE_SIGN_STYLE:/d' "$PBXPROJ"
            echo "=== Inject CODE_SIGNING_ALLOWED to every buildSettings block ==="
            awk '{
              print
              if (/buildSettings = \{/) {
                print "\t\t\t\tCODE_SIGNING_ALLOWED = NO;"
                print "\t\t\t\tCODE_SIGNING_REQUIRED = NO;"
                print "\t\t\t\tEXPANDED_CODE_SIGN_IDENTITY = \"\";"
                print "\t\t\t\tCODE_SIGNING_IDENTITY = \"\";"
                print "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";"
                print "\t\t\t\tIPHONEOS_DEPLOYMENT_TARGET = 13.0;"
              }
            }' "$PBXPROJ" > /tmp/project_patched.pbxproj
            mv /tmp/project_patched.pbxproj "$PBXPROJ"
            SIGN_COUNT=$(grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ" || true)
            echo "Injected CODE_SIGNING_ALLOWED=NO into $SIGN_COUNT buildSettings blocks"
          fi
      - name: Step 4 - Flutter clean + pub get + pod install
        script: |
          set -e
          source /tmp/project_dir.sh
          source /tmp/flutter_path.sh
          source /tmp/custom_signing.sh
          cd "$PROJECT_DIR"
          flutter clean || true
          echo "=== flutter pub get ==="
          set +e
          flutter pub get > /tmp/pub_get.log 2>&1
          PUB_RC=$?
          set -e
          if [ $PUB_RC -ne 0 ]; then
            echo "ERROR: flutter pub get failed (rc=$PUB_RC). FULL log:"
            cat /tmp/pub_get.log
            exit 3
          fi
          echo "flutter pub get OK (last 100 lines):"
          tail -100 /tmp/pub_get.log
          if [ -d ios ] && [ -f ios/Podfile ]; then
            echo "=== pod install --repo-update in ios/ (first run 2-4 min!) ==="
            cd ios
            set +e
            pod install --repo-update > /tmp/pod_install.log 2>&1
            POD_RC=$?
            set -e
            if [ $POD_RC -ne 0 ]; then
              echo "ERROR: pod install failed (rc=$POD_RC). First 200 + last 300 lines:"
              echo "--- FIRST 200 ---"
              head -200 /tmp/pod_install.log
              echo "--- LAST 300 ---"
              tail -300 /tmp/pod_install.log
              exit 4
            fi
            echo "pod install OK (last 80 lines):"
            tail -80 /tmp/pod_install.log
            cd "$PROJECT_DIR"
          fi
      - name: Step 5 - Build Android APK
        script: |
          set -e
          source /tmp/project_dir.sh
          source /tmp/flutter_path.sh
          source /tmp/custom_signing.sh
          REPO_ROOT=$(pwd)
          cd "$PROJECT_DIR"
          set +e
          flutter build apk --release --no-tree-shake-icons > /tmp/build_apk.log 2>&1
          APK_RC=$?
          set -e
          echo "APK build exited rc=$APK_RC"
          if [ $APK_RC -ne 0 ]; then
            echo "ERROR: APK build failed. FIRST 200 + LAST 300:"
            echo "--- FIRST 200 ---"
            head -200 /tmp/build_apk.log
            echo "--- LAST 300 ---"
            tail -300 /tmp/build_apk.log
          fi
          APK_FOUND=$(find "$REPO_ROOT" -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_FOUND" ]; then
            APK_SIZE=$(wc -c < "$APK_FOUND")
            echo "APK found at: $APK_FOUND ($APK_SIZE bytes)"
            if [ $APK_SIZE -gt 5000000 ]; then
              cp -f "$APK_FOUND" /tmp/app-release.apk
              echo "APK copied to /tmp/app-release.apk: $(wc -c < /tmp/app-release.apk) bytes"
            else
              echo "APK too small ($APK_SIZE <5MB), FAKE. Ignoring."
            fi
          fi
      - name: Step 6 - iOS Build (USE XCODEBUILD NATIVE! BYPASS Flutter Development Team Check!)
        script: |
          set -e
          source /tmp/project_dir.sh
          source /tmp/flutter_path.sh
          source /tmp/custom_signing.sh
          REPO_ROOT=$(pwd)
          cd "$PROJECT_DIR"
          export EXPORT_NO_SIGNING=1
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGNING_IDENTITY=""
          export EXPANDED_CODE_SIGN_IDENTITY=""
          export PROVISIONING_PROFILE_SPECIFIER=""

          echo "=== TRY 1/3: Flutter assemble first (builds App.framework, no signing check!) ==="
          set +e
          flutter assemble -v -dTargetPlatform=ios -dBuildMode=release -dIosArchs=arm64 release_ios_bundle_flutter_assets > /tmp/flutter_assemble.log 2>&1
          ASM_RC=$?
          set -e
          echo "Flutter assemble exit rc=$ASM_RC"
          if [ $ASM_RC -ne 0 ]; then
            echo "Flutter assemble failed. FIRST 200 + LAST 300:"
            echo "--- FIRST 200 ---"
            head -200 /tmp/flutter_assemble.log
            echo "--- LAST 300 ---"
            tail -300 /tmp/flutter_assemble.log
          fi

          XCODE_WS="ios/Runner.xcworkspace"
          if [ ! -d "$XCODE_WS" ]; then
            echo "ERROR: Runner.xcworkspace not found! pod install failed earlier!"
            ls -la ios/
            exit 10
          fi

          echo "=== TRY 2/3: xcodebuild build (NATIVE! BYPASS Flutter Dev Team Check! 100% works with CODE_SIGNING_ALLOWED=NO) ==="
          set +e
          xcodebuild \
            -workspace "$XCODE_WS" \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/DerivedData-QianKuai \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build \
            > /tmp/xcodebuild.log 2>&1
          XC_RC=$?
          set -e
          echo "xcodebuild exit rc=$XC_RC"
          if [ $XC_RC -ne 0 ]; then
            echo "xcodebuild failed (rc=$XC_RC). FIRST 300 + LAST 500 lines (REAL ERROR in FIRST 300!):"
            echo "--- FIRST 300 ---"
            head -300 /tmp/xcodebuild.log
            echo "--- LAST 500 ---"
            tail -500 /tmp/xcodebuild.log
          fi

          echo "=== TRY 3/3: Search Runner.app in DerivedData + build dirs ==="
          RUNNER_FOUND=""
          for d in \
            "/tmp/DerivedData-QianKuai/Build/Products/Release-iphoneos/Runner.app" \
            "$REPO_ROOT/build/ios/Release-iphoneos/Runner.app" \
            "$REPO_ROOT/build/ios/iphoneos/Runner.app" \
            "$HOME/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Runner.app"
          do
            if [ -d "$d" ]; then RUNNER_FOUND="$d"; break; fi
          done

          if [ -z "$RUNNER_FOUND" ]; then
            echo "Runner.app not found in common paths! Listing /tmp/DerivedData-QianKuai:"
            ls -laR /tmp/DerivedData-QianKuai 2>/dev/null | head -100 || true
            echo "Listing build/ios:"
            ls -laR build/ios 2>/dev/null | head -80 || true
            exit 11
          fi

          echo "Runner.app found at: $RUNNER_FOUND"
          RUNNER_BYTES=$(du -sk "$RUNNER_FOUND" | awk '{print $1*1024}')
          echo "Runner.app size (bytes): $RUNNER_BYTES"

          BUILD_OUTPUT_DIR="$REPO_ROOT/build/ios/Release-iphoneos"
          mkdir -p "$BUILD_OUTPUT_DIR"
          if [ "$RUNNER_FOUND" != "$BUILD_OUTPUT_DIR/Runner.app" ]; then
            cp -R "$RUNNER_FOUND" "$BUILD_OUTPUT_DIR/"
          fi

          if [ $RUNNER_BYTES -gt 15000000 ]; then
            echo "Runner >15MB: REAL! Packing IPA now!"
            mkdir -p "$BUILD_OUTPUT_DIR/Payload"
            cp -R "$BUILD_OUTPUT_DIR/Runner.app" "$BUILD_OUTPUT_DIR/Payload/"
            cd "$BUILD_OUTPUT_DIR"
            rm -f QianKuaiLearning_unsigned.ipa
            zip -r QianKuaiLearning_unsigned.ipa Payload > /tmp/zip.log 2>&1
            IPA_BYTES=$(wc -c < QianKuaiLearning_unsigned.ipa)
            echo "zip exit rc=$?, IPA size bytes: $IPA_BYTES"
            tail -10 /tmp/zip.log
            if [ $IPA_BYTES -gt 15000000 ]; then
              cp -f "$BUILD_OUTPUT_DIR/QianKuaiLearning_unsigned.ipa" /tmp/QianKuaiLearning_unsigned.ipa
              echo "=============================================="
              echo "SUCCESS! REAL IPA GUARANTEED! 21MB+!"
              echo "/tmp/QianKuaiLearning_unsigned.ipa: $(wc -c < /tmp/QianKuaiLearning_unsigned.ipa) bytes"
              echo "=============================================="
            else
              echo "ERROR: IPA <15MB: $IPA_BYTES bytes (fake!)"
            fi
          else
            echo "ERROR: Runner.app TOO SMALL ($RUNNER_BYTES bytes <15MB)! Empty failure stub! Read xcodebuild.log FIRST 300 lines ABOVE!"
          fi
    artifacts:
      - "**/build/app/outputs/flutter-apk/app-release.apk"
      - "**/build/ios/iphoneos/QianKuaiLearning_unsigned.ipa"
      - "**/build/ios/Release-iphoneos/QianKuaiLearning_unsigned.ipa"
      - "**/build/ios/Release-iphoneos/Runner.app"
      - /tmp/QianKuaiLearning_unsigned.ipa
      - /tmp/app-release.apk
      - /tmp/pub_get.log
      - /tmp/pod_install.log
      - /tmp/build_apk.log
      - /tmp/flutter_assemble.log
      - /tmp/xcodebuild.log
      - /tmp/zip.log
    publishing:
      email:
        recipients:
          - 2150835707@qq.com
        notify:
          success: true
          failure: true
