workflows:  default-workflow:    name: Default Workflow    max_build_duration: 90    instance_type: mac_mini_m2    environment:      flutter: 3.19.6      xcode: latest      cocoapods: default    triggering:      events:        - push      branch_patterns:        - pattern: "main"          include: true    scripts:      - name: Patch Flutter SDK to bypass Development Team check        script: |          set -e          echo "Patching Flutter SDK..."          FTOOLS="$FLUTTER_ROOT/packages/flutter_tools/lib/src/ios"          echo "Flutter tools path: $FTOOLS"          ls "$FTOOLS/"          # Find and patch the file that checks Development Team          grep -rl "Development Team" "$FTOOLS/" || true          # Patch xcode_backend.dart or ios_workflow.dart          for f in "$FTOOLS"/*.dart; do            if grep -q "Development Team" "$f" 2>/dev/null; then              echo "Found check in: $f"              # Comment out the check by replacing it with a dummy              sed -i 's/if (!_isDevelopmentTeamConfigured)/if (false) \&\& (!_isDevelopmentTeamConfigured)/g' "$f"              sed -i "s/throwToolException('No Development Team found for/'print('SKIP: Development Team check bypassed'); return; \/\/ throwToolException('No Development Team found for/g" "$f"            fi          done          # Also patch any generated xconfig          if [ -f "ios/Runner.xcodeproj/project.pbxproj" ]; then            echo "Patching project.pbxproj..."            sed -i 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "DUMMY";/g' ios/Runner.xcodeproj/project.pbxproj          fi          echo "Flutter SDK patched!"      - name: Install dependencies        script: |          flutter pub get      - name: Build iOS        script: |          flutter build ios --no-codesign --release    artifacts:      - build/ios/iphoneos/Runner.app.zip
