name: qiankuai_learning
description: 倩快学习 - 跨平台版（iOS+Android，Flutter原生）游戏化语言学习 + 沈星回AI陪伴系统
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ============ 状态管理（Riverpod，替代原SwiftUI @StateObject）============
  flutter_riverpod: ^2.5.1

  # ============ 路由导航 ============
  go_router: ^13.2.0

  # ============ 本地数据库 sqflite（替代CoreData）============
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3

  # ============ 文件解析引擎（6种格式全跨平台）============
  file_picker: ^6.1.1
  pdfx: ^2.6.0
  archive: ^3.4.10
  xml: ^6.5.0
  google_mlkit_text_recognition: ^0.13.0

  # ============ 音视频 / 语音 ============
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  audioplayers: ^5.2.1
  record: ^5.0.4

  # ============ 系统能力 ============
  flutter_local_notifications: ^16.3.2
  permission_handler: ^11.3.0
  timezone: ^0.9.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/idle_24fps/
    - assets/animations/interact_60fps/
    - assets/animations/cg_60fps/
    - assets/audio/
